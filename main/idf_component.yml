dependencies:
  # IP101 PHY 驱动自 ESP-IDF v6.0 起从 IDF 仓库移出，改为组件管理器分发
  # 版本与开发板自带 ethernet 示例保持一致
  espressif/ip101:
    version: "^1.1.0"

  # ---------------- 阶段 8：显示 / 触摸 / UI ----------------
  # 版本与开发板自带 lvgl_demo_v9 示例完全一致（已在该板上跑通 lv_demo_widgets）
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  espressif/esp_lvgl_port:
    version: "2.8.*"
    public: true
  # 7 寸 1024x600 屏的驱动 IC
  espressif/esp_lcd_jd9165:
    version: "*"
  # 电容触摸
  espressif/esp_lcd_touch_gt911:
    version: "^1"

  # ---------------- WiFi（ESP32-P4 没有射频，靠板载 C6 经 SDIO 提供） ----------------
  # esp_hosted 负责 SDIO 传输层 + C6 侧 slave 固件构建规则，
  # esp_wifi_remote 把标准 esp_wifi_* 调用转发给 C6 —— 上层代码不需要区分本地/远程。
  # 版本取自开发板配套的 xiaozhi-esp32 工程（同一块 P4V3 板，已验证 WiFi 可用）。
  # 关键 sdkconfig：CONFIG_SLAVE_IDF_TARGET_ESP32C6=y（见 sdkconfig.defaults），
  # 默认引脚 CLK=18 CMD=19 D0~D3=14~17 RESET=54，与本板 C6 连线一致。
  espressif/esp_hosted:
    version: "^3.0.7"
    rules:
    - if: target in [esp32p4]
  espressif/esp_wifi_remote:
    version: "^1.6.4"
    rules:
    - if: target in [esp32p4]
